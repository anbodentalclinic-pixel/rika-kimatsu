<html lang="ja">
<head>

<title>理科 期末テスト</title>

<style>
:root{--paper:#EEF1EC;--panel:#fff;--ink:#1F2621;--sub:#59645C;--line:#D4DBD3;--ok:#2E8B57;--ng:#C0392B;
--head:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;--body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif}
@media (prefers-color-scheme: dark){:root{--paper:#151A16;--panel:#1E2620;--ink:#E7EEE8;--sub:#A8B6AB;--line:#2E3A31}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2{font-family:var(--head);margin:0;line-height:1.35}
.wrap{max-width:1000px;margin:0 auto;padding:16px 18px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:48px;height:48px;border-radius:12px}
header h1{font-size:26px;font-weight:800}
.sub{color:var(--sub);font-size:14px}
.count{margin-left:auto;font-family:var(--head);font-weight:800;font-size:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 16px}
.count b{font-size:30px;color:var(--ng)}
.grp{font-family:var(--head);font-weight:800;color:var(--sub);margin:22px 0 8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;transition:transform .1s}
.card:hover{transform:translateY(-3px)}
.card .t{display:flex;align-items:center;gap:10px}
.card .emo{font-size:34px;line-height:1}
.card h2{font-size:24px;font-weight:800;color:var(--c)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c)}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--sub)}
.crow{color:var(--ng);font-weight:700}
.fix{border-left:8px solid var(--ng)}
.fix h2{font-size:22px;color:var(--ng)}
.fx{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border-top:1px solid var(--line);padding:10px 0}
.fx:first-of-type{border-top:0}
.fx .who{min-width:220px;flex:1}
.fx .who b{font-family:var(--head)}
.fx .qs{font-size:14px;color:var(--sub);flex-basis:100%;margin-top:-4px}
.fx .lv{font-family:var(--head);font-weight:800;color:var(--ng);white-space:nowrap}
.fx button{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:4px 14px;font-weight:700;font-size:15px}
.fx button.go{background:var(--ng);border-color:var(--ng);color:#fff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-top:18px;font-size:16px}
#player{position:fixed;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:10}
#player.on{display:flex}
#pbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#263238;color:#fff}
#pbar button{background:#fff;color:#263238;border:0;border-radius:10px;padding:6px 14px;font-weight:700;font-size:15px}
#pbar b{font-family:var(--head);font-size:18px}
#frame{flex:1;border:0;width:100%;background:var(--paper)}
</style>
</head>

function route(){
 const id=location.hash.slice(1),u=UNITS.find(x=>x.id===id);
 if(!u){$("player").classList.remove("on");$("frame").removeAttribute("srcdoc");cur=null;document.title="理科 期末テスト";drawHome();drawSync();syncNow();return;}
 $("ptitle").textContent=u.emo+" "+u.name;document.title="理科 "+u.name;
 if(cur!==u.id){const f=$("frame");f.onload=()=>{const w=f.contentWindow;if(u.sub){try{w.unit(u.sub);}catch(e){}}if(PENDING){try{w[PENDING.fn](...PENDING.a);}catch(e){}PENDING=null;}};f.srcdoc=dec(APPS[u.app]);cur=u.id;}
 $("player").classList.add("on");
}
$("back").onclick=()=>{location.hash="";};
$("syncOpen").onclick=()=>{$("syncForm").hidden=!$("syncForm").hidden;$("syncUrl").value=ls("rika-log-url")||DEFAULT_LOG_URL;};
$("syncSave").onclick=()=>{ls("rika-log-url",$("syncUrl").value.trim());$("syncForm").hidden=true;syncNow(true);drawSync();};
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
